name: Deploy to Server
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select the environment to deploy to"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
jobs:
  deploy:
    name: Deploy React App to Server
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      # Thêm step kết nối VPN/Tailscale nếu laptop ở trong mạng nội bộ
      # - name: Connect to Tailscale
      #   uses: tailscale/github-action@v2
      #   with:
      #     oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      #     oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}

      - name: Copy Source Code to Ubuntu Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "."
          target: "~/apps/react-fe-${{ inputs.environment }}"

      # 2. Thực thi lệnh SSH trên Ubuntu Server để Build & Run Docker Container
      - name: Build & Run Docker Container via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_NAME: ${{ inputs.environment }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: ENV_NAME
          script: |
            # Chuyển vào thư mục chứa source code
            cd ~/apps/react-fe-$ENV_NAME

            # Thiết lập Tên Container & Port chạy ứng dụng theo Môi trường
            CONTAINER_NAME="react-fe-$ENV_NAME"
            IMAGE_NAME="react-fe:$ENV_NAME"
            if [ "$ENV_NAME" = "production" ]; then
              PORT=80
            else
              PORT=8080
            fi
            echo "=== 1. Build Docker Image ($IMAGE_NAME) ==="
            docker build -t $IMAGE_NAME .
            echo "=== 2. Dừng và Xóa Container cũ (nếu tồn tại) ==="
            docker stop $CONTAINER_NAME || true
            docker rm $CONTAINER_NAME || true

            echo "=== 3. Chạy Container mới trên Port $PORT ==="
            docker run -d \
              --name $CONTAINER_NAME \
              --restart always \
              -p $PORT:80 \
              $IMAGE_NAME

            echo "=== 4. Dọn dẹp Docker Images rác/cũ ==="
            docker image prune -f
