name: Deploy React App to Ubuntu Server
on:
  push:
    branches: ["main"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up SSH & Deploy to Ubuntu
        uses: appleboy/ssh-action@v1.0.3
        with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SERVER_PORT }}
        script: |
          # Tạo thư mục app nếu chưa có
          mkdir -p ~/react-app
          cd ~/react-app

      - name: Copy source code qua SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "."
          target: "~/react-app"

      - name: Build & Run Docker Container trên Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd ~/react-app
            # Build Docker image trực tiếp trên Ubuntu
            docker build -t react-fe:latest .

            # Dừng và xóa container cũ nếu đang chạy
            docker stop react-fe-container || true
            docker rm react-fe-container || true

            # Chạy container mới trên cổng 8080 của Ubuntu
            docker run -d \
              --name react-fe-container \
              --restart always \
              -p 8080:80 \
              react-fe:latest
